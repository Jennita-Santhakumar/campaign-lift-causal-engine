services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: causal
      POSTGRES_PASSWORD: causal
      POSTGRES_DB: causal_impact
    ports:
      - "5510:5432"
    volumes:
      - causal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causal -d causal_impact"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://causal:causal@postgres:5432/causal_impact
    ports:
      - "8060:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8060
    ports:
      - "5230:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  causal_pg_data:
